<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YOUD SHOP</title>

  <link rel="stylesheet" href="style.css?v=2">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>

  <header class="topbar">
  <h1>YOUD(TOKYO) Shop</h1>

  <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
    功能菜单 ▼
  </button>

  <div id="mobileMenu" class="mobile-menu">
    <button id="adminToggleBtn" onclick="toggleAdminPanel()">
  管理员入口 ▼
</button>

<div id="adminPanel" class="login-box" style="display:none;">
  <input type="text" id="adminUser" placeholder="管理员账号">
  <input type="password" id="adminPass" placeholder="管理员密码">
  <button onclick="loginAdmin()">登录</button>
  <button onclick="logoutAdmin()">退出</button>
</div>

  <div class="button-row">
  <a href="favorites.html" class="fav-link">我的收藏</a>

  <button onclick="goOrdersPage()">
    查看订单
  </button>
</div>

<div class="button-row">
  <button onclick="location.href='cart.html'" class="cart-view-btn">
    查看购物车（<span id="cartCount">0</span>）
  </button>

  <button onclick="clearCart()">清空购物车</button>
</div>

<button onclick="openLoginModal()" class="fav-link">
  会员注册/登录
</button>

  <div class="nav-right">
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="搜索产品...">
  </div>

  <div id="searchStatus" class="search-status"></div>

    <select id="categoryFilter">
      <option>全部</option>
      <option>护肤</option>
      <option>彩妆</option>
      <option>保健</option>
    </select>
    <div id="subCategoryBox" class="sub-category-box"></div>
    <div class="admin-only category-manage">
     <input type="text" id="newCategory" placeholder="新增分类名称">
     <button onclick="addCategory()">新增分类</button>
</div>
  </div>
</header>

<div class="hero-banner"></div>

    <!-- 添加产品 -->
    <div class="form-box admin-only">

      <input type="text" id="name" placeholder="产品名称">

      <input type="text" id="price" placeholder="价格">

      <input type="text" id="variants" placeholder="规格：1盒=98,3盒=258,5盒=398">

      <input type="file" id="image" accept="image/*" multiple>

      <input type="text" id="desc" placeholder="产品介绍">

      <select id="category">
        <option value="护肤">护肤</option>
        <option value="食品">食品</option>
        <option value="日用品">日用品</option>
        <option value="其他">其他</option>
      </select>

      <button onclick="addProduct()">
        添加产品
      </button>

    </div>

<div class="banner">

  <div class="banner-text">
    <h1>YOUD SHOP</h1>
    <p>日本/泰国直邮可咨询</p >
    <button onclick="showQR()">获取微信客服二维码</button>
  </div>

  <img src="https://picsum.photos/1200/320?1" class="active">
  <img src="https://picsum.photos/1200/320?2">
  <img src="https://picsum.photos/1200/320?3">

</div>

<!-- 产品列表 -->
  <div id="productList" class="product-list"></div>

  <button id="loadMoreBtn" onclick="loadProducts(false)">
   加载更多
  </button>

  </div>

  <!--
  <div id="detailModal" class="modal" style="display: none;">
  <div class="modal-content">
    <span class="close-btn" onclick="closeDetail()">×</span>

    <img id="detailImage" src="" alt="产品图片">

    <h2 id="detailName"></h2>
    <p id="detailCategory"></p >
    <p id="detailDesc"></p >
  </div>
</div>
-->
<div id="imageViewer" style="display: none;"></div>
<div id="editModal" class="modal hidden">
  <div class="modal-content">
    <h2>编辑产品</h2>

    <input type="hidden" id="editIndex">

    <input type="text" id="editName" placeholder="产品名称">

    <input type="text" id="editDesc" placeholder="产品介绍">

    <select id="editCategory">
      <option value="护肤">护肤</option>
      <option value="药物类">食品</option>
      <option value="日用品">日用品</option>
      <option value="其他">其他</option>
    </select>
    <input id="editPrice" type="number" placeholder="价格">
    <input id="editSpec" type="text" placeholder="规格价格，例如：1袋=58，3袋=158，5袋=250">

    <button onclick="saveEditProduct()">保存修改</button>
    <button onclick="closeEditModal()">取消</button>
  </div>
</div>

  <div id="detailModal" class="modal hidden">
  <div class="modal-content">
    <button onclick="closeDetail()" class="close-btn">×</button>
    <img id="detailImage" src="">
    <h2 id="detailName"></h2>
    <p id="detailPrice"></p >
    <p id="detailDesc"></p >
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/compressorjs@1.2.1/dist/compressor.min.js"></script>
<script src="app.js?v=3"></script>

<div id="qrModal" class="qr-modal">
    <div class="qr-content">
        <span class="close-qr" onclick="closeQR()">×</span>

        <h3>扫码联系客服</h3>

        <img src="images/group-qr.jpg" alt="二维码">

        <p>长按识别二维码</p >
    </div>
</div>
<div id="loginModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:white;padding:25px;border-radius:12px;width:90%;max-width:360px;">
    <h3>会员注册/登录</h3>

    <input id="memberName" placeholder="用户名称" style="width:100%;padding:10px;margin:8px 0;">
    <input id="memberEmail" type="email" placeholder="邮箱" style="width:100%;padding:10px;margin:8px 0;">
    <input id="memberPassword" type="password" placeholder="密码" style="width:100%;padding:10px;margin:8px 0;">

    <button onclick="registerMember()" style="width:100%;padding:10px;margin-top:10px;">注册</button>
    <button onclick="loginMember()" style="width:100%;padding:10px;margin-top:10px;">登录</button>
    <button onclick="closeLoginModal()" style="width:100%;padding:10px;margin-top:10px;">关闭</button>

    <p id="loginMsg"></p >
  </div>
</div>
</body>
</html>
