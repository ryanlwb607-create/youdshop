<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YOUD SHOP</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>

    <div class="login-box">
  <input type="text" id="adminUser" placeholder="管理员账号">
  <input type="password" id="adminPass" placeholder="管理员密码">
  <button onclick="loginAdmin()">登录</button>
  <button onclick="logoutAdmin()">退出</button>
</div>

  <header class="topbar">
  <h1>YOUD(TOKYO) Shop</h1>
  <a href=" " class="fav-link">
️ 我的收藏
</a>

  <div class="nav-right">
    <input type="text" id="searchInput" placeholder="搜索产品...">

    <select id="categoryFilter">
      <option>全部</option>
      <option>护肤</option>
      <option>彩妆</option>
      <option>保健</option>
    </select>
    <div class="admin-only category-manage">
  <input type="text" id="newCategory" placeholder="新增分类名称">
  <button onclick="addCategory()">新增分类</button>
</div>
  </div>
</header>

<div class="hero-banner"></div>

    <!-- 添加产品 -->
    <div class="form-box admin-only">

      <input type="text" id="name" placeholder="产品名称">

      <input type="text" id="price" placeholder="价格">

      <input type="file" id="image" accept="image/*" multiple>

      <input type="text" id="desc" placeholder="产品介绍">

      <select id="category">
        <option value="护肤">护肤</option>
        <option value="食品">食品</option>
        <option value="日用品">日用品</option>
        <option value="其他">其他</option>
      </select>

      <button onclick="addProduct()">
        添加产品
      </button>

    </div>

<div class="banner">

  <div class="banner-text">
    <h1>YOUD SHOP</h1>
    <p>日本精选好物 · 东京直送</p >
    <button>立即查看</button>
  </div>

  <img src="https://picsum.photos/1200/320?1" class="active">
  <img src="https://picsum.photos/1200/320?2">
  <img src="https://picsum.photos/1200/320?3">

</div>

    <!-- 产品列表 -->
    <div id="productList" class="product-list"></div>

  </div>

  <!--
  <div id="detailModal" class="modal" style="display: none;">
  <div class="modal-content">
    <span class="close-btn" onclick="closeDetail()">×</span>

    <img id="detailImage" src="" alt="产品图片">

    <h2 id="detailName"></h2>
    <p id="detailCategory"></p >
    <p id="detailDesc"></p >
  </div>
</div>
-->
<div id="imageViewer" style="display: none;"></div>
<div id="editModal" class="modal hidden">
  <div class="modal-content">
    <h2>编辑产品</h2>

    <input type="hidden" id="editIndex">

    <input type="text" id="editName" placeholder="产品名称">

    <input type="text" id="editDesc" placeholder="产品介绍">

    <select id="editCategory">
      <option value="护肤">护肤</option>
      <option value="食品">食品</option>
      <option value="日用品">日用品</option>
      <option value="其他">其他</option>
    </select>

    <button onclick="saveEditProduct()">保存修改</button>
    <button onclick="closeEditModal()">取消</button>
  </div>
</div>

  <div id="detailModal" class="modal hidden">
  <div class="modal-content">
    <button onclick="closeDetail()" class="close-btn">×</button>
    <img id="detailImage" src="">
    <h2 id="detailName"></h2>
    <p id="detailPrice"></p >
    <p id="detailDesc"></p >
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=3"></script>

</body>
</html>
